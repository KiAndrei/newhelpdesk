[package]
name = "kiandrei/helpdesk-api"
version = "1.0.0"
description = "Helpdesk Ticket Management API"

[dependencies]
"php/php" = "=8.3.4"

[fs]
"/app/" = "."

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"
[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "localhost:8080"]
