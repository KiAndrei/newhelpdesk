# Optional Render Blueprint for the BACKEND + managed PostgreSQL.
# Render dashboard -> New -> Blueprint -> select your repo.
# (Check Render's current plan terms for free PostgreSQL limits/expiry.)
databases:
  - name: helpdesk-db
    databaseName: helpdesk
    user: helpdesk
    plan: free

services:
  - type: web
    name: helpdesk-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: CACHE_STORE
        value: file
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: helpdesk-db
          property: connectionString
      - key: APP_KEY
        sync: false        # paste output of: php artisan key:generate --show
      - key: APP_URL
        sync: false        # https://<your-service>.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false        # https://<your-frontend-domain>
